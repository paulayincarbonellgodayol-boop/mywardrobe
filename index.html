<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Digital Wardrobe</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-slate-100 flex justify-center">

  <!-- Phone Container -->
  <div class="w-[375px] min-h-screen bg-white shadow-xl rounded-[30px] overflow-hidden relative">

    <!-- Header -->
    <div class="p-5">
      <h1 class="text-lg font-semibold">Welcome back, Paula</h1>
    </div>

    <!-- Scrollable Content -->
    <div class="px-4 pb-24 space-y-4 overflow-y-auto">

      <!-- Wear Reminder Card -->
      <div class="bg-white rounded-2xl shadow-sm p-4 transition-all duration-300 hover:shadow-md">
        <h3 class="text-sm text-gray-500 mb-2">You haven’t worn this in 94 days</h3>
        <img src="outfit1.png" class="rounded-xl mb-3">
        <p class="font-medium">Black Blazer - Zara</p>
        <button class="mt-3 w-full bg-black text-white py-2 rounded-xl active:scale-95 transition">
          Wear today
        </button>
      </div>

      <!-- Outfit Suggestion -->
      <div class="bg-white rounded-2xl shadow-sm p-4 transition-all duration-300 hover:shadow-md">
        <h3 class="text-sm text-gray-500 mb-2">Today’s outfit idea</h3>
        <img src="outfit2.jpg" class="rounded-xl mb-3">
        <p class="text-sm text-gray-600">Based on your recent outfits</p>
      </div>

    </div>

    <!-- Bottom Navigation -->
    <div class="fixed bottom-0 w-[375px] bg-white border-t flex justify-around py-3">
      <button onclick="setActive(this)" class="nav-btn flex flex-col items-center text-xs transition active:scale-90 text-gray-400">
        <img src="outfit3.png" class="w-6 h-6 object-contain mb-1 opacity-70">
        Add
      </button>

      <button onclick="setActive(this)" class="nav-btn flex flex-col items-center text-xs transition active:scale-90 text-black">
        <img src="outfit4.jpg" class="w-6 h-6 object-contain mb-1 opacity-100">
        Outfit
      </button>

      <button onclick="setActive(this)" class="nav-btn flex flex-col items-center text-xs transition active:scale-90 text-gray-400">
        <img src="outfit5.png" class="w-6 h-6 object-contain mb-1 opacity-70">
        Wardrobe
      </button>
    </div>

  </div>

  <script>
    function setActive(clickedBtn) {
      const buttons = document.querySelectorAll('.nav-btn');

      buttons.forEach(btn => {
        btn.classList.remove('text-black');
        btn.classList.add('text-gray-400');

        const img = btn.querySelector('img');
        img.classList.remove('opacity-100');
        img.classList.add('opacity-70');
      });

      clickedBtn.classList.remove('text-gray-400');
      clickedBtn.classList.add('text-black');

      const activeImg = clickedBtn.querySelector('img');
      activeImg.classList.remove('opacity-70');
      activeImg.classList.add('opacity-100');
    }
  </script>

</body>
</html>
